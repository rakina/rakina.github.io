function tr2d(s) {
  if (s === undefined || s === null || s === '') return '';
  const str = String(s);
  if (typeof LANG === 'undefined' || LANG !== 'id') return str;
  if (Object.prototype.hasOwnProperty.call(TR_2D_ID, str)) return TR_2D_ID[str];
  if (typeof window !== 'undefined' && window.__checkMissing2D) window.__checkMissing2D.push(str);
  return str;
}

class Sheet {
  constructor(S, ox, oy) { this.S = S; this.ox = ox; this.oy = oy; this.L = { fill: [], hatch: [], furn: [], over: [], wall: [], open: [], ann: [], dim: [], lab: [] }; }
  X(x) { return +(this.ox + x * this.S).toFixed(1); }
  Y(y) { return +(this.oy + y * this.S).toFixed(1); }
  pts(arr) { return arr.map(p => this.X(p[0]) + ',' + this.Y(p[1])).join(' '); }
  poly(layer, arr, attrs) { this.L[layer].push(`<polygon points="${this.pts(arr)}" ${attrs}/>`); }
  rect(layer, x0, y0, x1, y1, attrs) { const a = Math.min(x0, x1), b = Math.min(y0, y1); this.L[layer].push(`<rect x="${this.X(a)}" y="${this.Y(b)}" width="${(Math.abs(x1 - x0) * this.S).toFixed(1)}" height="${(Math.abs(y1 - y0) * this.S).toFixed(1)}" ${attrs}/>`); }
  line(layer, x0, y0, x1, y1, attrs) { this.L[layer].push(`<line x1="${this.X(x0)}" y1="${this.Y(y0)}" x2="${this.X(x1)}" y2="${this.Y(y1)}" ${attrs}/>`); }
  pline(layer, arr, attrs) { this.L[layer].push(`<polyline points="${this.pts(arr)}" fill="none" ${attrs}/>`); }
  circle(layer, x, y, r, attrs) { this.L[layer].push(`<circle cx="${this.X(x)}" cy="${this.Y(y)}" r="${(r * this.S).toFixed(1)}" ${attrs}/>`); }
  text(layer, x, y, s, attrs = '') { const ts = tr2d(s); if (!ts) return; this.L[layer].push(`<text x="${this.X(x)}" y="${this.Y(y)}" ${attrs}>${esc(ts)}</text>`); }
  raw(layer, s) { this.L[layer].push(s); }
  out() { return Object.values(this.L).map(a => a.join('\n')).join('\n'); }

  // ---- walls ----
  segPoly(x0, y0, x1, y1, t) {
    const dx = x1 - x0, dy = y1 - y0, l = Math.hypot(dx, dy) || 1, nx = -dy / l * t / 2, ny = dx / l * t / 2;
    return [[x0 - nx, y0 - ny], [x1 - nx, y1 - ny], [x1 + nx, y1 + ny], [x0 + nx, y0 + ny]];
  }
  wallSeg(x0, y0, x1, y1, t, kind = 'ex') {
    const p = this.segPoly(x0, y0, x1, y1, t);
    if (kind === 'rem') this.poly('wall', p, `fill="${C.rem}" fill-opacity="0.08" stroke="${C.rem}" stroke-width="1.4" stroke-dasharray="5 3"`);
    else if (kind === 'new') this.poly('wall', p, `fill="${C.neu}" stroke="${C.neu}" stroke-width="0.6"`);
    else if (kind === 'low') this.poly('wall', p, `fill="#fff" stroke="${C.wall}" stroke-width="1.2"`);
    else this.poly('wall', p, `fill="${C.wall}" stroke="${C.wall}" stroke-width="0.6"`);
  }
  // wall with openings: ops = [{a,b,type:'door'|'door2'|'win'|'gap'|'slide'|'fixed', hinge:'a'|'b', side:+1|-1, kind}]
  wall(x0, y0, x1, y1, t, kind = 'ex', ops = []) {
    const l = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / l, uy = (y1 - y0) / l, nx = -uy, ny = ux;
    const P = d => [x0 + ux * d, y0 + uy * d];
    let cur = 0;
    for (const o of [...ops].sort((p, q) => p.a - q.a)) {
      if (o.a > cur + 0.005) this.wallSeg(...P(cur), ...P(o.a), t, kind);
      const k = o.kind || kind;
      const col = k === 'new' ? C.neu : k === 'rem' ? C.rem : C.wall;
      const dash = k === 'rem' ? ' stroke-dasharray="5 3"' : '';
      const A = P(o.a), B = P(o.b);
      if (o.type === 'win' || o.type === 'fixed' || o.type === 'slide') {
        const pp = this.segPoly(...A, ...B, t);
        this.poly('open', pp, `fill="#fff" stroke="${col}" stroke-width="${k === 'new' ? 1.8 : 1}"${dash}`);
        if (o.type === 'slide') {
          const m = (o.a + o.b) / 2, off = t * 0.18;
          const a1 = P(o.a), m1 = P(m + 0.1), m0 = P(m - 0.1), b1 = P(o.b);
          this.line('open', a1[0] + nx * off, a1[1] + ny * off, m1[0] + nx * off, m1[1] + ny * off, `stroke="${col}" stroke-width="1.6"${dash}`);
          this.line('open', m0[0] - nx * off, m0[1] - ny * off, b1[0] - nx * off, b1[1] - ny * off, `stroke="${col}" stroke-width="1.6"${dash}`);
        } else this.line('open', ...A, ...B, `stroke="${col}" stroke-width="${k === 'new' ? 1.8 : 1.1}"${dash}`);
        if (o.sill) this.line('open', A[0] + nx * o.sill, A[1] + ny * o.sill, B[0] + nx * o.sill, B[1] + ny * o.sill, `stroke="${col}" stroke-width="0.8"`);
      } else if (o.type === 'door' || o.type === 'door2') {
        const leaf = (H, J, w) => {
          const sd = o.side || 1, T = [H[0] + nx * sd * w, H[1] + ny * sd * w];
          this.line('open', ...H, ...T, `stroke="${col}" stroke-width="2"${dash}`);
          const cr = (J[0] - H[0]) * (T[1] - H[1]) - (J[1] - H[1]) * (T[0] - H[0]);
          this.raw('open', `<path d="M${this.X(J[0])},${this.Y(J[1])} A${(w * this.S).toFixed(1)},${(w * this.S).toFixed(1)} 0 0 ${cr > 0 ? 1 : 0} ${this.X(T[0])},${this.Y(T[1])}" fill="none" stroke="${col}" stroke-width="0.8" stroke-dasharray="3 2"/>`);
        };
        if (o.type === 'door') leaf(o.hinge === 'b' ? B : A, o.hinge === 'b' ? A : B, o.b - o.a);
        else { const M = P((o.a + o.b) / 2); leaf(A, M, (o.b - o.a) / 2); leaf(B, M, (o.b - o.a) / 2); }
        if (o.frame) { this.line('open', ...A, ...B, `stroke="${col}" stroke-width="0.6"`); }
      }
      cur = o.b;
    }
    if (cur < l - 0.005) this.wallSeg(...P(cur), x1, y1, t, kind);
  }
  // ---- furniture ----
  furn(x0, y0, x1, y1, opt = {}) {
    const st = opt.rem ? `stroke="${C.rem}" stroke-dasharray="4 2"` : opt.neu ? `stroke="${C.neu}"` : `stroke="${C.furn}"`;
    const fill = opt.fill || (opt.neu ? C.joinFill : C.furnFill);
    this.rect('furn', x0, y0, x1, y1, `fill="${fill}" ${st} stroke-width="${opt.neu ? 1.2 : 0.9}"${opt.rx ? ` rx="${opt.rx * this.S}"` : ''}`);
    if (opt.label) this.text('furn', (x0 + x1) / 2, (y0 + y1) / 2 + 0.06, opt.label, `class="fl"${opt.vert ? ` transform="rotate(-90 ${this.X((x0 + x1) / 2)} ${this.Y((y0 + y1) / 2)})"` : ''}`);
  }
  chair(x, y, w, d, back, opt = {}) {
    this.furn(x, y, x + w, y + d, opt);
    const b = 0.07, s = opt.neu ? C.neu : C.furn;
    if (back === 'N') this.line('furn', x, y + b, x + w, y + b, `stroke="${s}"`);
    if (back === 'S') this.line('furn', x, y + d - b, x + w, y + d - b, `stroke="${s}"`);
    if (back === 'E') this.line('furn', x + w - b, y, x + w - b, y + d, `stroke="${s}"`);
    if (back === 'W') this.line('furn', x + b, y, x + b, y + d, `stroke="${s}"`);
  }
  bed(x0, y0, x1, y1, head, opt = {}) {
    this.furn(x0, y0, x1, y1, opt);
    const s = C.furn;
    if (head === 'E') { this.line('furn', x1 - 0.08, y0, x1 - 0.08, y1, `stroke="${s}"`); this.rect('furn', x1 - 0.5, y0 + 0.12, x1 - 0.14, (y0 + y1) / 2 - 0.05, `fill="#fff" stroke="${s}" stroke-width="0.7" rx="3"`); this.rect('furn', x1 - 0.5, (y0 + y1) / 2 + 0.05, x1 - 0.14, y1 - 0.12, `fill="#fff" stroke="${s}" stroke-width="0.7" rx="3"`); this.line('furn', x0 + (x1 - x0) * 0.45, y0, x0 + (x1 - x0) * 0.45, y1, `stroke="${s}" stroke-width="0.6"`); }
    if (head === 'W') { this.line('furn', x0 + 0.08, y0, x0 + 0.08, y1, `stroke="${s}"`); this.rect('furn', x0 + 0.14, y0 + 0.15, x0 + 0.5, y1 - 0.15, `fill="#fff" stroke="${s}" stroke-width="0.7" rx="3"`); }
  }
  sofa(x0, y0, x1, y1, back, opt = {}) {
    this.furn(x0, y0, x1, y1, Object.assign({ rx: 0.06 }, opt));
    const s = C.furn, b = 0.2, a = 0.14;
    if (back === 'E') { this.rect('furn', x1 - b, y0, x1, y1, `fill="#e4e4e0" stroke="${s}"`); this.line('furn', x0, y0 + a, x1 - b, y0 + a, `stroke="${s}"`); this.line('furn', x0, y1 - a, x1 - b, y1 - a, `stroke="${s}"`); }
    if (back === 'S') { this.rect('furn', x0, y1 - b, x1, y1, `fill="#e4e4e0" stroke="${s}"`); this.line('furn', x0 + a, y0, x0 + a, y1 - b, `stroke="${s}"`); this.line('furn', x1 - a, y0, x1 - a, y1 - b, `stroke="${s}"`); }
  }
  // ---- annotation ----
  room(x, y, name, sub, opt = {}) {
    const cls = opt.out ? 'rn rn-out' : 'rn';
    this.text('lab', x, y, name, `class="${cls}"${opt.size ? ` style="font-size:${opt.size}px"` : ''}`);
    const tsub = tr2d(sub);
    if (tsub) String(tsub).split('\n').forEach((s, i) => { if (s) this.L.lab.push(`<text x="${this.X(x)}" y="${this.Y(y + (0.27 + i * 0.24))}" class="rs${opt.subcls ? ' ' + opt.subcls : ''}">${esc(s)}</text>`); });
  }
  note(x, y, s, opt = {}) { this.text('lab', x, y, s, `class="${opt.cls || 'nt'}"${opt.anchor ? ` text-anchor="${opt.anchor}"` : ''}${opt.rot ? ` transform="rotate(${opt.rot} ${this.X(x)} ${this.Y(y)})"` : ''}`); }
  tag(x, y, n, col = C.neu) {
    this.circle('lab', x, y, 0.17, `fill="${col}" stroke="#fff" stroke-width="1.2"`);
    this.text('lab', x, y + 0.06, n, `class="tagn"`);
  }
  // dimension line between points, offset perpendicular by off (m)
  dim(x0, y0, x1, y1, off, label, opt = {}) {
    const l = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / l, uy = (y1 - y0) / l, nx = -uy * off, ny = ux * off;
    const a = [x0 + nx, y0 + ny], b = [x1 + nx, y1 + ny];
    const col = opt.col || C.dim;
    this.line('dim', x0, y0, a[0] + Math.sign(off) * -uy * 0.08, a[1] + Math.sign(off) * ux * 0.08, `stroke="${col}" stroke-width="0.6"`);
    this.line('dim', x1, y1, b[0] + Math.sign(off) * -uy * 0.08, b[1] + Math.sign(off) * ux * 0.08, `stroke="${col}" stroke-width="0.6"`);
    this.line('dim', ...a, ...b, `stroke="${col}" stroke-width="0.9"`);
    [a, b].forEach(p => this.line('dim', p[0] - 0.07 * (ux + uy) , p[1] - 0.07 * (uy - ux), p[0] + 0.07 * (ux + uy), p[1] + 0.07 * (uy - ux), `stroke="${col}" stroke-width="1.3"`));
    const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const ang = Math.atan2(uy, ux) * 180 / Math.PI;
    const rot = (ang > 90 || ang < -90) ? ang + 180 : ang;
    const tOff = opt.inside ? 0.2 : -0.07;
    const tx = m[0] + (-uy) * (Math.sign(off) || 1) * (opt.flip ? -0.2 : 0) , ty = m[1] + ux * (Math.sign(off) || 1) * (opt.flip ? -0.2 : 0);
    this.raw('dim', `<text x="${this.X(tx)}" y="${this.Y(ty)}" class="dt" dy="${opt.below ? 11 : -3}" transform="rotate(${rot.toFixed(1)} ${this.X(tx)} ${this.Y(ty)})" fill="${col}">${esc(tr2d(label))}</text>`);
  }
  // stair treads given list of tread lines (pairs of points) and arrow path
  arrow(path, label, opt = {}) {
    const col = opt.col || '#333';
    this.pline('ann', path, `stroke="${col}" stroke-width="1.3"${opt.dash ? ' stroke-dasharray="5 3"' : ''}`);
    const n = path.length, p = path[n - 1], q = path[n - 2];
    const dx = p[0] - q[0], dy = p[1] - q[1], l = Math.hypot(dx, dy), ux = dx / l, uy = dy / l, s = 0.16;
    this.poly('ann', [p, [p[0] - ux * s - uy * s * 0.55, p[1] - uy * s + ux * s * 0.55], [p[0] - ux * s + uy * s * 0.55, p[1] - uy * s - ux * s * 0.55]], `fill="${col}"`);
    this.circle('ann', path[0][0], path[0][1], 0.05, `fill="${col}"`);
    if (label) this.text('ann', opt.lx ?? path[0][0], opt.ly ?? path[0][1], label, `class="stl"`);
  }
}

// north arrow + scale bar (in px coordinates)
function northArrow(cx, cy) {
  // true north in model: +X rotated 7 deg toward -Y (courtyard faces ~277 deg). Screen: X right, Y down.
  const ang = Math.atan2(-0.122, 0.993) * 180 / Math.PI; // screen angle of N
  return `<g transform="translate(${cx},${cy})">
    <circle r="30" fill="#fff" stroke="#adb5bd"/>
    <g transform="rotate(${(ang + 90).toFixed(1)})"><polygon points="0,-26 8,8 0,2 -8,8" fill="#1d242b"/><text y="-31" class="na" text-anchor="middle">N</text></g>
    <text y="46" class="nts" text-anchor="middle">${esc(tr2d('true north'))}</text>
  </g>`;
}
function scaleBar(x, y, S) {
  let s = `<g transform="translate(${x},${y})">`;
  for (let i = 0; i < 5; i++) s += `<rect x="${i * S}" y="0" width="${S}" height="7" fill="${i % 2 ? '#fff' : '#1d242b'}" stroke="#1d242b" stroke-width="0.8"/>`;
  for (let i = 0; i <= 5; i++) s += `<text x="${i * S}" y="20" class="sb" text-anchor="middle">${i}</text>`;
  s += `<text x="${5 * S + 10}" y="8" class="sb">${esc(tr2d('metres'))}</text></g>`;
  return s;
}

  s.poly('wall', s.segPoly(L(-1.20) - 0.15, -1.20, L(2.55) - 0.15, 2.55, 0.30), `fill="#495057" stroke="#212529" stroke-width="0.8"`);

  let o = '';
  const path = (pts, col, w, dash) => {
    o += `<polyline points="${pts.map(([y, z]) => X(y) + ',' + Z(z)).join(' ')}" fill="none" stroke="${col}" stroke-width="${w}"${dash ? ' stroke-dasharray="6 3"' : ''}/>`;
    const [y1, z1] = pts[pts.length - 1], [y0, z0] = pts[pts.length - 2];
    const a = Math.atan2(Z(z1) - Z(z0), X(y1) - X(y0)), h = 8;
    o += `<polygon points="${X(y1)},${Z(z1)} ${(X(y1) - h * Math.cos(a - 0.45)).toFixed(1)},${(Z(z1) - h * Math.sin(a - 0.45)).toFixed(1)} ${(X(y1) - h * Math.cos(a + 0.45)).toFixed(1)},${(Z(z1) - h * Math.sin(a + 0.45)).toFixed(1)}" fill="${col}"/>`;
  };
  const T = (y, z, t, col) => { o += `<text class="dyn" x="${X(y)}" y="${Z(z)}" style="font-size:9.5px;font-weight:700;fill:${col};paint-order:stroke;stroke:#fff;stroke-width:3px" text-anchor="middle">${esc(tr2d(t))}</text>`; };
  if (OVL.airflow && OVL.level < 3) {
    path([[10.6, 3.7], [7.0, 3.6], [4.0, 3.6], [2.0, 3.65]], '#0ca678', 2.2);
    path([[9.5, 1.1], [6.0, 1.1], [3.0, 0.9], [0.5, 0.7]], '#0ca678', 2.2);
    path([[4.0, 3.2], [4.0, 5.3], [4.6, 6.8], [7.0, 7.6]], '#f76707', 2.0, true);
    T(6.5, 4.0, 'cross-breeze', '#0b7285'); T(5.8, 7.9, 'warm air ↑ void → 4 boven flaps', '#c94a0a');
  }
  if (OVL.night) {
    [4.85, 7.65].forEach(y => { o += `<polygon points="${X(y)},${Z(5.2)} ${X(y - 0.6)},${Z(2.2)} ${X(y + 0.6)},${Z(2.2)}" fill="#ffd43b" fill-opacity="0.22"/>`; });
  }
  return o;
}

function footerSvg() {
  const txt = LANG === 'id'
    ? 'Sketsa konsep dari foto · tidak berskala penuh · seluruh ukuran wajib diverifikasi melalui survei'
    : 'Concept sketch from photos · not to scale · all dimensions to be verified by survey';
  return `<text x="${W - 30}" y="${H - 20}" text-anchor="end" style="font-size:12px;font-style:italic;fill:#868e96">${txt}</text>`;
}
function planSheet(key) {
  const v = VIEWS[key];
  const S = 60, s = new Sheet(S, 30 + 0.95 * S, 58 + 2.05 * S);
  if (v.fl === 1) plan1F(s, v.after); else if (v.fl === 2) plan2F(s, v.after); else plan3F(s, v.after);
  drawOverlays2D(s, v.fl, v.after);
  const col = v.after ? C.neu : C.rem;
  const items = LANG === 'id' ? v.items_id : v.items;
  const title = LANG === 'id' ? v.t_id : v.t;
  const sub = LANG === 'id'
    ? 'Rencana renovasi rumah · batang skala dalam meter · ukuran perkiraan model 3D (±5–10 cm) · A = garis potongan'
    : 'House renovation plan · scale bar in metres · dimensions approximate (from 3D model, ±5–10 cm) · A = section line';
  const listHdr = v.after
    ? (LANG === 'id' ? 'Rincian perubahan pada lantai ini' : 'What changes on this floor (2028 orange · ~2042 purple)')
    : (LANG === 'id' ? 'Bagian yang dibongkar tahun 2028 (merah putus-putus)' : 'What changes in 2028 (red dashed = removed)');
  const rearTxt = LANG === 'id' ? '↑ BELAKANG · taman dalam (hadap ≈281° WNW)' : '↑ REAR · courtyard (faces ≈281° WNW)';
  const frontTxt = LANG === 'id' ? '↓ DEPAN · jalan (hadap ≈101° ESE)' : '↓ FRONT · street (faces ≈101° ESE)';
  let o = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" class="sheet">${DEFS}<rect width="${W}" height="${H}" fill="#fff"/>`;
  o += `<rect x="12" y="12" width="${W - 24}" height="${H - 24}" fill="none" stroke="#ced4da"/>`;
  o += `<g>${s.out()}</g>`;
  o += `<text x="40" y="44" class="orient">${rearTxt}</text><text x="40" y="${H - 26}" class="orient">${frontTxt}</text>`;
  o += northArrow(705, 70) + scaleBar(450, H - 52, S);
  o += `<line x1="${s.X(5.2)}" y1="${s.Y(-1.7)}" x2="${s.X(5.2)}" y2="${s.Y(-1.35)}" stroke="#1d242b" stroke-width="2"/><text x="${s.X(5.2) + 6}" y="${s.Y(-1.45)}" class="secm">A</text>`;
  const px = 830;
  o += `<line x1="${px - 25}" y1="30" x2="${px - 25}" y2="${H - 30}" stroke="#dee2e6"/>`;
  o += `<text x="${px}" y="58" class="tt">${esc(title)}</text><text x="${px}" y="81" class="st">${esc(sub)}</text>`;
  o += listSvg(px, 118, listHdr, items, col);
  const ly = 118 + 26 + items.length * 18.2 + 14;
  o += legendSvg(px, ly);
  const notes = NOTES_I18N[LANG];
  o += notesSvg(px + 10, Math.max(ly + 196, H - 38 - notes.length * 18.5 - 18), 700);
  return o + footerSvg() + '</svg>';
}
function sectionSheet() {
  const tt = LANG === 'id'
    ? 'Potongan memanjang A–A (≈5,2 m dari batas samping) — taman belakang ← → jalan'
    : 'Long section A–A (at ≈5.2 m from the side lot line) — rear courtyard ← → street';
  const st = LANG === 'id'
    ? 'Kiri: SEBELUM (eksisting) · Kanan: RENCANA 2028 (oranye) & persiapan void ~2042 (ungu putus-putus). Garis potongan A ditandai pada denah.'
    : 'Left: BEFORE (as built) · Right: AFTER (★ 2028 plan in orange; ~2042 closable void in purple dashed). Section line A is marked on the plans.';
  let o = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" class="sheet">${DEFS}<rect width="${W}" height="${H}" fill="#fff"/><rect x="12" y="12" width="${W - 24}" height="${H - 24}" fill="none" stroke="#ced4da"/>`;
  o += `<text x="40" y="50" class="tt">${esc(tt)}</text>`;
  o += `<text x="40" y="74" class="st">${esc(st)}</text>`;
  o += `<text x="40" y="128" class="ph" fill="${C.rem}">${LANG === 'id' ? 'SEBELUM (eksisting)' : 'BEFORE (as built)'}</text><text x="800" y="128" class="ph" fill="${C.neu}">${LANG === 'id' ? 'RENCANA 2028 (★ Tahap 1 + Persiapan ~2042)' : 'AFTER (★ 2028 plan + ~2042 prep)'}</text>`;
  o += `<g>${section(false, 30, 560)}</g><g>${section(true, 790, 560)}</g>`;
  o += sectionOverlays(790, 560);
  o += `<line x1="780" y1="110" x2="780" y2="600" stroke="#dee2e6"/>`;
  o += scaleBar(40, 640, 42) + legendSvg(40, 695) + notesSvg(560, 700, 900);
  return o + footerSvg() + '</svg>';
}
function accessSheet() {
  const tt = LANG === 'id'
    ? 'Opsi akses bebas tangga (~2041/42) — TIDAK dibangun di 2028 (hanya fondasi & jalur listrik)'
    : 'Future access options (~2041/42) — NOT built in 2028 (2028 casts footings & power conduits only)';
  const st = LANG === 'id'
    ? 'Tiap sketsa: atas = dinding batas belakang, kanan = garasi. Balkon L2 garis putus-putus. Naik 2,2 m dengan tinggi bersih L1 2,1 m → lift/stair-lift paling nyaman.'
    : 'Each sketch: top = rear boundary wall, right = garage. Upper-level balcony dashed. Honest finding: with a 2.2 m climb and 2.1 m 1F headroom, no ramp can be gentle on this plot.';
  const cards = LANG === 'id' ? ACCESS_ID : ACCESS;
  let o = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" class="sheet">${DEFS}<rect width="${W}" height="${H}" fill="#fff"/><rect x="12" y="12" width="${W - 24}" height="${H - 24}" fill="none" stroke="#ced4da"/>`;
  o += `<text x="40" y="50" class="tt">${esc(tt)}</text>`;
  o += `<text x="40" y="74" class="st">${esc(st)}</text>`;
  cards.forEach((a, i) => {
    const gx = 30 + i * 505, gy = 110;
    o += `<rect x="${gx}" y="${gy}" width="490" height="480" fill="none" stroke="#dee2e6" rx="6"/>`;
    o += `<text x="${gx + 14}" y="${gy + 28}" class="ph">${esc(a.t)}</text>`;
    o += `<g>${accessMini(a.k, gx + 10, gy + 50)}</g>`;
    a.lines.forEach((l, j) => o += `<text x="${gx + 14}" y="${gy + 370 + j * 21}" class="nl">${esc(l)}</text>`);
  });
  o += scaleBar(40, 625, 54) + legendSvg(40, 688) + notesSvg(560, 690, 900);
  return o + footerSvg() + '</svg>';
}

const TABS_I18N = {
  en: [
    ['f1b', '1F before'], ['f1a', '1F after (2028)'],
    ['f2b', '2F before'], ['f2a', '2F after (2028)'],
    ['f3b', '3F before'], ['f3a', '3F (2028 vs 2042)'],
    ['sec', 'Section A–A'], ['acc', 'Access options'], ['all', 'All (print)']
  ],
  id: [
    ['f1b', 'L1 sebelum'], ['f1a', 'L1 rencana (2028)'],
    ['f2b', 'L2 sebelum'], ['f2a', 'L2 rencana (2028)'],
    ['f3b', 'L3 sebelum'], ['f3a', 'L3 (2028 vs 2042)'],
    ['sec', 'Potongan A–A'], ['acc', 'Opsi akses bebas tangga'], ['all', 'Semua (cetak)']
  ]
};

function buildTabs() {
  const tabs = TABS_I18N[LANG];
  const hint = LANG === 'id'
    ? 'Rencana Renovasi · Tahap 1 (2028) vs Tahap 2 (~2042)'
    : 'House renovation plan · Phase 1 (2028) vs Phase 2 (~2042)';
  const OV = OVL_I18N[LANG];
  document.getElementById('tabs').innerHTML =
    tabs.map(([k, t]) => `<button data-k="${k}" onclick="location.hash='${k}'">${t}</button>`).join('')
    + `<span class="hint">${hint}</span>`
    + `<span class="lang-pill" title="Switch language / Ganti bahasa">`
    + `<button class="${LANG === 'en' ? 'on' : ''}" onclick="setLang('en')">EN</button>`
    + `<button class="${LANG === 'id' ? 'on' : ''}" onclick="setLang('id')">ID</button>`
    + `</span>`
    + `<div class="ovl-row"><span class="ovl-lbl">${OV.lbl}</span>`
    + ['airflow', 'night'].map(k => {
        const txt = OV[k];
        const on = OVL[k];
        return `<button class="ovl${on ? ' on' : ''}" onclick="toggleOvl('${k}')">${txt}</button>`;
      }).join('')
    + `<span class="ovl-sep"></span><span class="ovl-lbl">${OV.lvl}</span>`
    + [0, 1, 2, 3].map(n => `<button class="ovl${OVL.level === n ? ' on' : ''}" onclick="setLevel(${n})">${OV.levels[n]}</button>`).join('')
    + `<button class="ovl${OVL.entry && OVL.level < 3 ? ' on' : ''}" onclick="toggleOvl('entry')">${OVL.entry && OVL.level < 3 ? OV.entryOn : OV.entryOff}</button>`
    + `<span class="ovl-sep"></span><span class="ovl-lbl">${OV.lab}</span>`
    + `<button class="ovl${OVL.notes ? ' on' : ''}" onclick="toggleOvl('notes')">${OV.notes}</button>`
    + `<button class="ovl${OVL.live ? ' on' : ''}" onclick="toggleOvl('live')">${OV.live}</button>`
    + `</div>`;
  document.body.classList.toggle('hide-notes', !OVL.notes);
  document.body.classList.toggle('hide-live', !OVL.live);
}
function setLevel(n) { OVL.level = n; buildTabs(); render(); }
function toggleOvl(k) {
  OVL[k] = !OVL[k];
  buildTabs();
  render();
}
function setLang(l) {
  LANG = l;
  buildTabs();
  render();
}
function render() {
  const key = (location.hash || '#f2a').slice(1);
  document.querySelectorAll('#tabs > button[data-k]').forEach(b => b.classList.toggle('on', b.dataset.k === key));
  const one = k => k === 'sec' ? sectionSheet() : k === 'acc' ? accessSheet() : planSheet(k);
  const tabs = TABS_I18N[LANG];
  document.getElementById('view').innerHTML = key === 'all' ? tabs.slice(0, 8).map(t => `<div class="pg">${one(t[0])}</div>`).join('') : one(VIEWS[key] || key === 'sec' || key === 'acc' ? key : 'f2a');
  document.body.classList.toggle('shot', new URLSearchParams(location.search).get('shot') === '1');
}
buildTabs();
window.addEventListener('hashchange', render);
render();

</script>
</body>
</html>
